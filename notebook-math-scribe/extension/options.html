<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Notebook Math Scribe — Settings</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 420px;
    margin: 32px auto;
    color: #1f2937;
    background: #ffffff;
  }
  h1 { font-size: 16px; margin-bottom: 4px; }
  p.hint { font-size: 12.5px; color: #6b7280; margin-top: 0; }
  label { display: block; margin-top: 16px; font-size: 13px; font-weight: 600; }
  input {
    width: 100%;
    padding: 8px 10px;
    margin-top: 6px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 13px;
    box-sizing: border-box;
  }
  input:focus { outline: none; border-color: #6366f1; }
  .actions { margin-top: 20px; }
  button {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #4f46e5; }
  button.secondary {
    background: #e5e7eb;
    color: #1f2937;
    margin-left: 8px;
  }
  button.secondary:hover { background: #d1d5db; }
  #status { margin-top: 14px; font-size: 13px; min-height: 16px; }
  #status.ok { color: #15803d; }
  #status.error { color: #b91c1c; }
</style>
</head>
<body>
  <h1>Notebook Math Scribe — Settings</h1>
  <p class="hint">These are stored locally in the browser and sent from the extension with every request.</p>

  <label for="backend-url">Backend URL</label>
  <input id="backend-url" type="text" placeholder="http://127.0.0.1:8000" autocomplete="off" />

  <label for="api-key">API Key</label>
  <input id="api-key" type="password" placeholder="Shared secret, if the backend requires one" autocomplete="off" />

  <div class="actions">
    <button id="save-btn">Save</button>
    <button id="test-btn" class="secondary">Test connection</button>
  </div>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
